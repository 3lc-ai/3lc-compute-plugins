name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:   # reused as the gate by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pyproject.toml routes unreleased 3LC dists to its explicit `staging` index; uv picks the
# index's credentials up from UV_INDEX_STAGING_*.
env:
  UV_INDEX_STAGING_USERNAME: ${{ secrets.STAGING_INDEX_READ_USERNAME }}
  UV_INDEX_STAGING_PASSWORD: ${{ secrets.STAGING_INDEX_READ_PASSWORD }}

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      # Ruff runs STANDALONE (uvx): linting must not require resolving the per-plugin
      # dependency stacks — that would be slow and need extra indexes. Config lives in
      # pyproject [tool.ruff]; pin matches 3lc-compute-plugin-sdk.
      - name: Ruff lint
        run: uvx --from 'ruff>=0.15,<0.16' ruff check .

      - name: Ruff format check
        run: uvx --from 'ruff>=0.15,<0.16' ruff format --check .

  lockfile:
    name: lockfile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Verify lockfile is up to date
        run: uv lock --check

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base deps + dev group
        run: uv sync --locked --group dev

      - name: Check distribution and manifest versions
        run: uv run --no-sync python scripts/release_version.py

      - name: Run tests
        run: uv run --no-sync pytest -v
