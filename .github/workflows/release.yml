name: Release

# Publish a tagged release of 3lc-compute-plugins (the open first-party plugin umbrella) to
# 3LC CloudRepo (pypi.3lc.ai) via `uv publish`. Mirrors 3lc-plugin-sdk/.github/workflows/release.yml.
#
# WHY CloudRepo (not PyPI): public-PyPI publishing is still blocked, so the beta ships over
# CloudRepo as the interim route (same workaround as 3lc-compute / 3lc-plugin-sdk). The umbrella
# is open + beta, so it targets the PUBLIC prerelease repo. Flip to PyPI/OIDC later when unblocked.
#
# === ONE-TIME SETUP ===
# Create a GitHub Environment named "release" (repo Settings -> Environments) holding:
#   Secrets:
#     CLOUDREPO_USERNAME    - CloudRepo upload user (≈ the ACCESS_KEY)
#     CLOUDREPO_PASSWORD    - CloudRepo upload password/token (≈ the SECRET_KEY)
#   Variables:
#     CLOUDREPO_PUBLISH_URL - upload endpoint, mirroring 3lc-compute / 3lc-plugin-sdk:
#                             https://pypi.3lc.ai/public/repositories/prereleases-public/
#                             (confirm the exact UPLOAD url with whoever owns the CloudRepo.)
# Optionally add required reviewers on the "release" environment to gate publishes.
#
# To cut a release: bump `version` in pyproject.toml, commit, then push a tag `vX.Y.Z`
# that matches it (or run via workflow_dispatch).
#
# NOTE: `uv build --no-sources` builds the umbrella WHEEL only — it does not resolve or install the
# per-plugin ML stacks (torch/timm/sam3/ultralytics), so no extra indexes are needed here. The
# wheel's metadata carries `3lc-plugin-sdk[shared]>=0.1.0,<0.2.0`, resolved from the index at
# install time (so the SDK must be published to the same/compatible index first).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Gate the release on CI (ruff lint + format — the umbrella's standalone, syncless checks).
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    env:
      UV_PUBLISH_URL: ${{ vars.CLOUDREPO_PUBLISH_URL }}
      UV_PUBLISH_USERNAME: ${{ secrets.CLOUDREPO_USERNAME }}
      UV_PUBLISH_PASSWORD: ${{ secrets.CLOUDREPO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.15"

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          PKG=$(uv version --output-format json | jq -r '.version')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$PKG tag=$TAG"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $GITHUB_REF_NAME ($TAG) != pyproject version $PKG"; exit 1; }

      - name: Verify the 'release' environment is configured
        run: |
          : "${UV_PUBLISH_URL:?set the CLOUDREPO_PUBLISH_URL variable on the 'release' environment}"
          : "${UV_PUBLISH_USERNAME:?set the CLOUDREPO_USERNAME secret on the 'release' environment}"
          : "${UV_PUBLISH_PASSWORD:?set the CLOUDREPO_PASSWORD secret on the 'release' environment}"

      # On manual (workflow_dispatch) runs, append the GitHub run number as a 4th release
      # segment so every prerelease publish is unique — CloudRepo has overwrites disabled, so
      # re-publishing the static pyproject version 409s. A 4th segment (e.g. 0.1.0.7) sorts
      # ABOVE the base version and stays inside `<0.2.0`-style pins, so dependents still resolve
      # it — unlike `.devN` (sorts BELOW 0.1.0, excluded by `>=0.1.0`) or `+localN` (rejected on
      # upload). Tag (`v*`) releases skip this and publish the exact pyproject version, verified
      # above. Mirrors the ADO wheel scheme (e.g. 3lc-hub-frontend 0.2.0.52).
      - name: Stamp build-numbered version (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          BASE=$(uv version --output-format json | jq -r '.version')
          uv version "${BASE}.${GITHUB_RUN_NUMBER}"
          echo "prerelease build version: ${BASE}.${GITHUB_RUN_NUMBER}"

      # --no-sources strips [tool.uv.sources] so the released wheel never bakes in a dev
      # index/path override (the published artifact resolves deps from the configured index).
      - name: Build
        run: uv build --no-sources

      - name: Publish to CloudRepo
        run: uv publish
