# 3lc-plugin-yolo — fine-tune YOLO models as an isolated venv plugin.
#
# Distribution `3lc-plugin-yolo`, import package `tlc_plugin_yolo`. This is a real
# installable package (unlike the old in-tree `package = false` form): once the plugin
# left the monorepo, `tlc_compute.plugins.yolo` no longer exists, so the worker imports
# `tlc_plugin_yolo` from this venv's site-packages. The compute-service reads the plugin's
# metadata from plugin.toml WITHOUT importing it, then provisions this venv (uv sync) and
# runs the entrypoint in a worker subprocess.
#
# Isolating yolo in its own venv is also what keeps the AGPL `3lc-ultralytics` dependency
# out of the host's dependency closure — it lives only here.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-plugin-yolo"
version = "1.0.0"
description = "Fine-tune YOLO models on your data with live metrics, SocketIO progress, and experiment tracking."
requires-python = ">=3.10"
# The contract is the SDK (brings 3lc + uvicorn + litestar). The heavy ML stack is this
# plugin's own — isolated in this venv, never in the host venv.
dependencies = [
    "3lc-plugin-sdk>=0.2.0,<0.3.0",
    "3lc-ultralytics",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tlc_plugin_yolo"]

# Pull torch/torchvision from the CUDA 12.6 index on Linux (mirrors the host).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# 3lc private releases index — 3lc versions not yet on public PyPI.
[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
3lc = { index = "3lc-releases" }
3lc-ultralytics = { git = "https://github.com/3lc-ai/3lc-ultralytics.git", branch = "feature/fred/instance-level-embeddings-3.0" }
# DEV-ONLY (build-out): the SDK is unpublished, so resolve it from the sibling checkout.
# Drop this line once 3lc-plugin-sdk is on the index.
3lc-plugin-sdk = { path = "../../../3lc-plugin-sdk", editable = true }

# The 3lc-ultralytics branch's own pyproject points 3lc → ../tlc-monorepo (its local
# dev layout). Override its metadata so uv resolves 3lc from the index instead of trying
# to build from a path that doesn't exist in this venv.
[[tool.uv.dependency-metadata]]
name = "3lc-ultralytics"
version = "0.3.0"
requires-dist = [
    "3lc>=3.0.0,<4.0.0",
    "pacmap>=0.8.0",
    "ultralytics>=8.4.0,<8.4.7",
]
