# 3lc-plugin-merger — combine two tables, as a light in-process (host-mode) plugin.
#
# Distribution `3lc-plugin-merger`, import package `tlc_plugin_merger`. Unlike the
# venv plugins (timm/sam3/yolo), a host-mode plugin's deps are light enough to live in
# the host venv, so it is delivered by being pip-installed there via `3lc-compute[plugins]`
# — NOT provisioned into its own venv. The host discovers it through the
# `tlc_compute.plugins` entry point below, then reads the `plugin.toml` bundled inside
# the package (next to __init__.py, exactly as an in-tree plugin) and imports the
# entrypoint in-process.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-plugin-merger"
version = "1.0.0"
description = "Combine two tables into one by merging rows or columns."
requires-python = ">=3.10"
# Host-mode: the only dependency is the SDK contract (which brings 3lc + litestar).
# No heavy stack — that is exactly what makes it host-mode rather than venv-isolated.
dependencies = [
    "3lc-plugin-sdk>=0.2.0,<0.3.0",
]

# How the host finds an installed host plugin: the value is the import package; its
# bundled plugin.toml drives id/ui/runtime + the in-process entrypoint.
[project.entry-points."tlc_compute.plugins"]
merger = "tlc_plugin_merger"

[tool.hatch.build.targets.wheel]
packages = ["src/tlc_plugin_merger"]

# 3lc private releases index — 3lc versions not yet on public PyPI.
[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
3lc = { index = "3lc-releases" }
# DEV-ONLY (build-out): the SDK is unpublished, so resolve it from the sibling checkout.
# Drop this line once 3lc-plugin-sdk is on the index.
3lc-plugin-sdk = { path = "../../../3lc-plugin-sdk", editable = true }
