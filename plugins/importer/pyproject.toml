# 3lc-plugin-importer — a light in-process (host-mode) plugin for the 3LC Compute Service.
#
# Distribution `3lc-plugin-importer`, import package `tlc_plugin_importer`. Host-mode: its
# deps are light enough to live in the host venv, so it is delivered by being
# pip-installed there via `3lc-compute[plugins]` rather than provisioned into its own
# venv. The host discovers it through the `tlc_compute.plugins` entry point below, reads
# the `plugin.toml` bundled inside the package, and imports the entrypoint in-process.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-plugin-importer"
version = "1.0.0"
description = "Import datasets from CSV, Parquet, COCO, and other formats into 3LC projects."
requires-python = ">=3.10"
dependencies = [
    "3lc-plugin-sdk>=0.2.0,<0.3.0",
    "openpyxl>=3.1",
    "pyyaml",
    "numpy",
    "datasets",
    "transformers",
]

[project.entry-points."tlc_compute.plugins"]
importer = "tlc_plugin_importer"

[tool.hatch.build.targets.wheel]
packages = ["src/tlc_plugin_importer"]

[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
3lc = { index = "3lc-releases" }
# DEV-ONLY (build-out): the SDK is unpublished, so resolve it from the sibling checkout.
# Drop this line once 3lc-plugin-sdk is on the index.
3lc-plugin-sdk = { path = "../../../3lc-plugin-sdk", editable = true }
