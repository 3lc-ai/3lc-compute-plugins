# 3lc-compute-plugins — the open, first-party plugins for the 3LC compute service,
# packaged as ONE distribution (an umbrella; single-plugin and multi-dist repos are equally
# valid elsewhere — the host discovers by scanning a folder Source, not by repo shape).
#
# This distribution is NEVER installed into the host venv. The host discovers these plugins via a
# folder Source pointed at `src/` (TLC_COMPUTE_EXTERNAL_PLUGIN_DIRS / --plugin-dir), reads each
# bundled `plugin.toml` manifest WITHOUT importing, and provisions each plugin into its OWN venv.
# Every open plugin here is `venv`-isolated: its deps live in a per-plugin extra below and are
# installed only into that plugin's provisioned venv (selected by the manifest's
# runtime.provision_extra, via `uv sync --extra <id>`) — never the host venv. The base
# `dependencies` is the SDK floor only. That is the whole "manifest in the host, heavy code in the
# venv" split. (The `tlc_compute.plugins` entry points below are kept for the optional
# pip-installed-discovery path, but folder-Source discovery is how the host consumes these today.)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-compute-plugins"
version = "0.1.0"
description = "Open, first-party plugins for the 3LC compute service (all venv-isolated)."
requires-python = ">=3.10"
# Base = the contract SDK floor ONLY. Every open plugin is now `venv`-isolated, so NO plugin
# deps (light or heavy) live in the base — each plugin's deps ride its own extra below and are
# installed only into that plugin's provisioned venv. The host never installs this distribution
# into its own venv; it discovers the plugins via a folder Source and provisions each one.
# [shared] = the SDK's optional `tlc` data plane behind `tlc_plugin_sdk.shared.*`, which every
# plugin uses (and `tlc` directly); the bare SDK no longer pulls `tlc`.
dependencies = [
    "3lc-plugin-sdk[shared]>=0.2.0,<0.3.0",
]

# Per-plugin extras — installed ONLY into that plugin's provisioned venv. Provisioning opts into
# the extra named by the plugin manifest's runtime.provision_extra (`uv sync --extra <id>`).
[project.optional-dependencies]
# Open CPU plugins (formerly host-mode; now venv for shop/static-index deliverability).
importer = [
    "openpyxl>=3.1",
    "pyyaml",
    "datasets",         # tlc HuggingFace import path
    "transformers",     # tlc HuggingFace import path
    "numpy",
    "pillow",
]
exporter = [
    "openpyxl>=3.1",
]
merger = []             # no deps beyond the SDK floor; venv-isolated for consistency
splitter = [
    "numpy",
]
table_statistics = [
    "pyarrow",
    "numpy",
]
image_metrics = [
    "numpy",
    "pillow",
]
# Heavy GPU/ML plugin. NOTE: sam3 and yolo were extracted to their own standalone repos
# (3lc-plugin-sam3 / 3lc-plugin-yolo) — yolo because 3lc-ultralytics carries AGPL-lineage
# licensing the open umbrella should not inherit, sam3 alongside it on the same cadence.
timm = [
    "timm>=1.0",
    "torch",
    "torchvision",
    "pacmap>=0.8",
    "umap-learn>=0.5",
]

# Every plugin advertises itself here; the host iterates this group to discover them all.
# Value = the import package; its bundled plugin.toml drives id/ui/runtime (and, for venv
# plugins, the provision extra).
[project.entry-points."tlc_compute.plugins"]
timm = "tlc_plugin_timm"
importer = "tlc_plugin_importer"
exporter = "tlc_plugin_exporter"
merger = "tlc_plugin_merger"
splitter = "tlc_plugin_splitter"
table_statistics = "tlc_plugin_table_statistics"
image_metrics = "tlc_plugin_image_metrics"

[tool.hatch.build.targets.wheel]
packages = [
    "src/tlc_plugin_timm",
    "src/tlc_plugin_importer",
    "src/tlc_plugin_exporter",
    "src/tlc_plugin_merger",
    "src/tlc_plugin_splitter",
    "src/tlc_plugin_table_statistics",
    "src/tlc_plugin_image_metrics",
]

# torch/torchvision from the CUDA 12.6 index on Linux — used only when a heavy extra is
# selected during venv provisioning (not on a bare/host install).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# 3lc releases index — 3lc versions not yet on public PyPI.
[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
# 3lc and the (still-unpublished) SDK resolve from the releases index / GitHub here. This
# is the committed form on purpose: the host consumes this umbrella as a GIT dependency, and
# a committed `path = "../<repo>"` source breaks every remote consumer because uv reinterprets
# the relative path as a git *subdirectory of this repo* (`#subdirectory=../3lc-plugin-sdk`),
# which doesn't exist. For side-by-side local dev, override these UNCOMMITTED, e.g.
#   3lc            = { path = "../tlc-monorepo",   editable = true }   # venv worker on the host's dev build
#   3lc-plugin-sdk = { path = "../3lc-plugin-sdk", editable = true }
# Drop the SDK git line once 3lc-plugin-sdk is published to an index.
3lc = { index = "3lc-releases" }
3lc-plugin-sdk = { git = "https://github.com/3lc-ai/3lc-plugin-sdk.git", branch = "develop" }

# Ruff config mirrors 3lc-plugin-sdk for a consistent house style. CI runs ruff
# standalone (uvx) — linting must not require resolving the heavy per-plugin ML stacks.
[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["A", "C4", "E", "EM", "F", "I", "N", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["N806", "N818", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
docstring-code-format = true
