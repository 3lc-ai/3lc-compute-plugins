# 3lc-compute-plugins — the open, first-party plugins for the 3LC compute service,
# packaged as ONE distribution (an umbrella; single-plugin and multi-dist repos are equally
# valid elsewhere — the host discovers by entry point, not by repo shape).
#
# The host installs the BASE (every plugin's light code + its bundled plugin.toml manifest +
# the host-mode plugins' light deps) via `3lc-compute[plugins]`, discovers all plugins through
# the `tlc_compute.plugins` entry-point group, runs the host-mode ones in-process, and reads
# (without importing) the venv ones. Each venv plugin's heavy stack is an extra below; the host
# installs it ONLY into that plugin's provisioned venv (selected by the manifest's
# runtime.provision_extra) — never the host venv. That is the whole "manifest in the host,
# heavy code in the venv" split.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3lc-compute-plugins"
version = "0.1.0"
description = "Open, first-party plugins for the 3LC compute service (host-mode + venv)."
requires-python = ">=3.10"
# Base = the contract SDK + the light deps the in-process (host-mode) plugins need in the host
# venv. NO heavy ML deps here — those are the per-venv-plugin extras below.
dependencies = [
    "3lc-plugin-sdk>=0.2.0,<0.3.0",
    "openpyxl>=3.1",        # importer, exporter
    "pyyaml",               # importer
    "datasets",             # importer (HuggingFace import)
    "transformers",         # importer (HuggingFace import)
    "pyarrow",              # table_statistics
    "numpy",                # importer / splitter / table_statistics / image_metrics
    "pillow",               # image_metrics
]

# Per-venv-plugin heavy stacks — installed ONLY into that plugin's provisioned venv.
# Provisioning opts into the extra named by the plugin manifest's runtime.provision_extra.
[project.optional-dependencies]
timm = [
    "timm>=1.0",
    "torch",
    "torchvision",
    "pacmap>=0.8",
    "umap-learn>=0.5",
]
sam3 = [
    "sam3",
    "torch",
    "torchvision",
    "umap-learn>=0.5",
]
yolo = [
    "3lc-ultralytics>=0.3.3",
    "torch",
    "torchvision",
]

# Every plugin advertises itself here; the host iterates this group to discover them all.
# Value = the import package; its bundled plugin.toml drives id/ui/runtime (and, for venv
# plugins, the provision extra).
[project.entry-points."tlc_compute.plugins"]
timm = "tlc_plugin_timm"
sam3 = "tlc_plugin_sam3"
yolo = "tlc_plugin_yolo"
importer = "tlc_plugin_importer"
exporter = "tlc_plugin_exporter"
merger = "tlc_plugin_merger"
splitter = "tlc_plugin_splitter"
table_statistics = "tlc_plugin_table_statistics"
image_metrics = "tlc_plugin_image_metrics"

[tool.hatch.build.targets.wheel]
packages = [
    "src/tlc_plugin_timm",
    "src/tlc_plugin_sam3",
    "src/tlc_plugin_yolo",
    "src/tlc_plugin_importer",
    "src/tlc_plugin_exporter",
    "src/tlc_plugin_merger",
    "src/tlc_plugin_splitter",
    "src/tlc_plugin_table_statistics",
    "src/tlc_plugin_image_metrics",
]

# torch/torchvision from the CUDA 12.6 index on Linux — used only when a heavy extra is
# selected during venv provisioning (not on a bare/host install).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# 3lc private releases index — 3lc versions not yet on public PyPI.
[[tool.uv.index]]
name = "3lc-releases"
url = "https://pypi.3lc.ai/public/repositories/releases-public"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
3lc = { index = "3lc-releases" }
# DEV-ONLY (build-out): the SDK repo is PRIVATE + unpublished, so a git pin can't resolve
# without credentials (uv's HTTPS fetch 401s). Resolve it from the sibling checkout for local
# dev + venv provisioning. SHIPPABLE FORM: pin from the index once the SDK is published to
# CodeArtifact / 3lc-releases (the long pole) — then CI `uv sync` works credential-free.
3lc-plugin-sdk = { path = "../3lc-plugin-sdk", editable = true }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["A", "C4", "E", "EM", "F", "I", "N", "PIE", "RUF", "SIM", "UP", "W"]
ignore = ["N806", "N818", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
# src/ layout with multiple top-level packages (tlc_plugin_*).
mypy_path = "src"
explicit_package_bases = true

# Untyped / not-installed-in-base boundary: tlc + the heavy ML stacks the venv plugins
# import (torch/timm/sam3/ultralytics/...) are not in the base install and/or ship no stubs.
[[tool.mypy.overrides]]
module = [
    "tlc", "tlc.*", "tlcurl.*",
    "torch", "torch.*", "torchvision", "torchvision.*",
    "timm", "timm.*", "sam3", "sam3.*",
    "ultralytics", "ultralytics.*", "tlc_ultralytics", "tlc_ultralytics.*",
    "pacmap", "umap", "umap.*",
    "datasets", "datasets.*", "transformers", "transformers.*",
    "openpyxl", "openpyxl.*", "pyarrow", "pyarrow.*", "yaml",
]
ignore_missing_imports = true
