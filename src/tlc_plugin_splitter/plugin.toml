# 3LC Compute plugin manifest — the single source of truth for this plugin's
# metadata. The host loads the plugin via runtime.entrypoint; there is no
# register() call at import and no metadata on the plugin class.
id = "splitter"
name = "Split"
description = "Split a table into train, validation, and test sets with random or stratified sampling."
version = "0.2.5"
min_service_version = "1.2.0"
# <tlc-table-field> (the table fields) is defined by the Hub from 1.2.0 on.
min_frontend_version = "1.2.0"
icon = "✂"
icon_svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="4.5" r="2"/><circle cx="4.5" cy="11.5" r="2"/><path d="M6.2 5.8L13 12M6.2 10.2L13 4"/></svg>'

[ui]
display_mode = "sidebar"
section = "Data Ops"
compatible_with = ["table"]
input_types = ["table"]
output_types = ["table"]
priority = 75
group = "Table Ops"
group_icon_svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M2 6h12M6 2v12"/></svg>'
quick_action = true
quick_action_label = "Split Table"
quick_action_description = "Split a table into train/val/test sets"

[runtime]
isolation = "venv"
entrypoint = "tlc_plugin_splitter:SplitterPlugin"
# Deps live behind this extra of the umbrella distribution; the host installs it ONLY
# into this plugin's provisioned venv, never the host venv.
provision_extra = "splitter"
# A split can run beside its table on a node as well as on this host.
remote_capable = true
# Dotted keys into the run body: the table a split reads.
data_inputs = ["table_url"]

[mcp]
knowledge = ["docs/mcp/*.md"]

[[mcp.tools]]
name = "grouped_split"
description = "Split a first dataset reproducibly into train/validation and optional test native revisions. All samples sharing group_column stay together (video, patient or capture session). Without a group column, samples must be independent; duplicate images must first be removed using Merge intake. Never re-split an existing evaluation set when appending training data. Uses the same native Split job logic, no model call."
job = { body = { operation = "grouped_split", table_url = "{{table_url}}", group_column = "{{group_column}}", train_pct = "{{train_pct}}", val_pct = "{{val_pct}}", test_pct = "{{test_pct}}", seed = "{{seed}}" }, outputs = ["splits"], wait = true }
input_schema = { type = "object", additionalProperties = false, required = ["table_url"], properties = { table_url = { type = "string", minLength = 1 }, group_column = { type = "string", default = "" }, train_pct = { type = "integer", minimum = 1, maximum = 99, default = 80 }, val_pct = { type = "integer", minimum = 1, maximum = 99, default = 20 }, test_pct = { type = "integer", minimum = 0, maximum = 98, default = 0 }, seed = { type = "integer", minimum = 0, default = 42 } } }

[[mcp.tools]]
name = "weighted_subset"
description = "Publish an EditedTable revision keeping keep_count randomly selected positive-weight samples from the exact source revision. Sets only excluded positive weights to zero; preserves existing zero weights, kept weights, all physical rows and revision history. CPU only: pass node_id=local to use this deployment; no cloud node or GPU is required. Never infer eligible count from the run name or total rows; use table_weight_summary first."
job = { body = { operation = "weighted_subset", table_url = "{{table_url}}", keep_count = "{{keep_count}}", seed = "{{seed}}", table_name = "{{table_name}}", project_name = "{{project_name}}" }, outputs = ["table_url", "subset"], wait = true }
input_schema = { type = "object", required = ["table_url", "keep_count"], properties = { table_url = { type = "string" }, keep_count = { type = "integer", minimum = 1 }, seed = { type = "integer", minimum = 0, default = 42 }, table_name = { type = "string" }, project_name = { type = "string" } } }
