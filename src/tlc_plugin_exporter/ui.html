<!-- Export Wizard — self-contained plugin UI fragment -->
<style>
/* Unique to exporter — not in main.css */
.plugin-page .format-options-label {
  font-size: 12px; font-weight: 600; color: var(--text-secondary, #6b7280);
  letter-spacing: 0.3px; margin-bottom: 10px;
}
.export-col-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 6px; }
.export-col-item { display: flex; align-items: center; gap: 8px; padding: 4px 0;
  font-size: 12px; border-bottom: 1px solid var(--border-light, rgba(0,0,0,0.05)); }
.export-col-item:last-child { border-bottom: none; }
.export-col-type { font-size: 9px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: 0.3px; background: var(--bg-secondary, #f3f4f6);
  color: var(--text-muted); white-space: nowrap; }
.export-col-type.type-image { background: var(--badge-blue-bg, #dbeafe); color: var(--badge-blue-text, #1d4ed8); }
.export-col-type.type-bbox { background: var(--badge-yellow-bg, #fef3c7); color: var(--badge-yellow-text, #92400e); }
.export-col-type.type-segmentation { background: var(--badge-purple-bg, #ede9fe); color: var(--badge-purple-text, #6d28d9); }
.export-col-type.type-number { background: var(--badge-green-bg, #d1fae5); color: var(--badge-green-text, #065f46); }
.export-col-type.type-embedding { background: var(--badge-pink-bg, #fce7f3); color: var(--badge-pink-text, #9d174d); }
.export-col-actions { display: flex; gap: 8px; margin-top: 6px; }
.export-col-actions button { font-size: 11px; padding: 3px 10px; background: transparent;
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
  color: var(--text-muted); font-weight: 500; }
.export-col-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.export-col-actions button:disabled { opacity: .5; cursor: not-allowed; }
/* Keep the destination and column selection visible together on wide screens. */
#export-details { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px 32px; }
#export-details > * { min-width: 0; grid-column: 1 / -1; }
#export-details > .form-group { margin-bottom: 0; }
#export-format-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px 24px; }
#export-format-options .format-options-label { grid-column: 1 / -1; margin-bottom: 0; }
#export-format-options .form-group { margin-bottom: 0; min-width: 0; }
@container plugin-card (min-width: 1000px) {
  #export-details { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #export-details:has(#export-column-section:not([style*="none"])) > .export-destination,
  #export-column-section { grid-column: auto; }
}
</style>

<div class="plugin-page plugin-workbench">
  <header class="plugin-page-heading">
  <h1>Export dataset</h1>
  <p>Choose a table, an export format and a destination.</p>
</header>

  <div id="export-result"></div>

  <div class="card" id="export-form">
    <div class="card-header"><div class="card-title">Table &amp; output</div></div>
    <div class="card-body">

      <!-- Table URL -->
      <div class="form-group">
        <label class="form-label required" for="export-table-url">Table URL</label>
        <tlc-table-field id="export-table-url" placeholder="Paste table URL or click Browse…" required></tlc-table-field>

      </div>

      <!-- Format selector -->
      <div class="form-group">
        <label class="form-label required">Export Format</label>
        <div class="format-grid" id="export-format-grid">
          <div style="font-size:13px;color:var(--text-muted)">Loading formats…</div>
        </div>
      </div>

      <!-- Details (hidden until format selected) -->
      <div id="export-details" style="display:none">
        <div class="form-group export-destination">
          <label class="form-label required">Output Path</label>
          <div id="export-output-ds"></div>
          <div class="form-help" id="export-output-help"></div>
          <!-- What the export writes, from the value as the server reads it (updateOutputNotes). -->
          <div class="form-help" id="export-writes" style="min-height:1.5em"></div>
        </div>

        <!-- Column selector (for CSV/XLSX) -->
        <div id="export-column-section" style="display:none">
          <div class="form-group">
            <label class="form-label">Columns</label>
            <div class="export-col-actions">
              <button type="button" id="export-select-all" onclick="_expSelectAll(true)" disabled>Select all</button>
              <button type="button" id="export-deselect-all" onclick="_expSelectAll(false)" disabled>Deselect all</button>
              <span id="export-col-count" style="font-size:11px;color:var(--text-muted);margin-left:auto"></span>
            </div>
            <div class="export-col-list" id="export-col-list">
              <div style="font-size:12px;color:var(--text-muted);padding:8px 0">
                Enter a table URL to load columns…
              </div>
            </div>
          </div>
        </div>

        <!-- Format-specific options injected here -->
        <div id="export-format-options"></div>

        <hr class="divider">
        <div style="display:flex;gap:10px;align-items:center">
          <button type="button" class="btn btn-primary btn-lg" id="export-submit-btn"
                  aria-describedby="export-submit-why" disabled>↓ Export</button>
          <span class="spinner" id="export-spinner" style="display:none"></span>
          <span id="export-status" style="display:none;font-size:12px;color:var(--text-muted)">
            Exporting… this may take a moment.</span>
        </div>
        <!-- Why Export cannot run yet; always one line high, so the page does not move as it comes and goes. -->
        <div class="text-sm text-muted" id="export-submit-why" style="margin-top:6px;line-height:1.5;min-height:1.5em"></div>
      </div>

    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var API = window.PLUGIN_API;
  var computeUrl = API.getConfig('compute_service_url');
  var formats = [];
  var selectedFormat = null;
  var tableColumns = [];
  var tableProject = '';  // the exported table's own project (from /columns)
  var tableStem = '';     // the name the output chooser suggests, before the extension (from /columns)
  var outputChooser = null;  // the output path's chooser (bound below); told when the format changes

  var urlParams = new URLSearchParams(window.location.search);
  var prefillUrl = '';
  if (API.context.resourceUrls && API.context.resourceUrls.length) {
    prefillUrl = API.context.resourceUrls[0];
  } else {
    prefillUrl = urlParams.get('url') || urlParams.get('table') || '';
  }

  function loadFormats() {
    API.authFetch(computeUrl + '/api/plugins/exporter/formats')
      .then(function(r) { return r.json(); })
      .then(function(data) { formats = data; renderFormatGrid(); })
      .catch(function(err) {
        document.getElementById('export-format-grid').innerHTML =
          '<div style="color:var(--error)">Failed to load formats: ' + err.message + '</div>';
      });
  }

  function renderFormatGrid() {
    var grid = document.getElementById('export-format-grid');
    grid.innerHTML = '';
    formats.forEach(function(fmt) {
      var card = document.createElement('button');
      card.type = 'button';
      card.setAttribute('aria-pressed', String(selectedFormat === fmt.name));
      card.dataset.format = fmt.name;
      card.className = 'format-card' + (selectedFormat === fmt.name ? ' active' : '');
      card.innerHTML =
        '<span class="format-card-name">' + _esc(fmt.display_name) + '</span>' +
        '<span class="format-card-desc">' + _esc(fmt.description) + '</span>';
      card.onclick = function() { selectFormat(fmt.name); };
      grid.appendChild(card);
    });
  }

  function selectFormat(name) {
    var before = selectedFormatDef();
    selectedFormat = name;
    renderFormatGrid();
    var selectedCard = document.querySelector('#export-format-grid .format-card.active');
    if (selectedCard) selectedCard.focus({preventScroll: true});
    document.getElementById('export-details').style.display = '';
    renderFormatOptions();
    followFormat(before);
    var colSection = document.getElementById('export-column-section');
    if (needsColumns()) {
      colSection.style.display = '';
      var tableUrl = currentTableUrl();
      if (tableUrl && tableColumns.length === 0) loadColumns(tableUrl);
    } else {
      colSection.style.display = 'none';
    }
    gate();
  }

  // Which table the column list belongs to, and how its listing went ('loading', 'ok' or 'error'). The
  // gate compares it with the field, so a list read for an earlier table never goes out with a new one.
  var _colsUrl = '';
  var _colsState = '';

  function loadColumns(tableUrl) {
    if (!tableUrl) return;
    tableProject = '';
    tableStem = '';
    _colsUrl = tableUrl;
    _colsState = 'loading';
    // The column list only exists for needs_column_select formats; this also runs
    // for yolo/coco purely to resolve the table's project for job attribution.
    var list = document.getElementById('export-col-list');
    if (list) list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">Loading columns…</div>';
    gate();
    API.authFetch(computeUrl + '/api/plugins/exporter/columns', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table_url: tableUrl }),
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (_colsUrl !== tableUrl) return;  // another table was asked for since
        if (data.error) {
          _colsState = 'error';
          if (list) list.innerHTML = '<div style="color:var(--error);font-size:12px;padding:8px 0">' + _esc(data.error) + '</div>';
          gate();
          return;
        }
        tableProject = data.project_name || '';
        tableStem = data.suggested_stem || '';
        tableColumns = data.columns || [];
        _colsState = 'ok';
        renderColumnList();
      })
      .catch(function(err) {
        if (_colsUrl !== tableUrl) return;
        _colsState = 'error';
        if (list) list.innerHTML = '<div style="color:var(--error);font-size:12px;padding:8px 0">Failed: ' + _esc(err.message) + '</div>';
        gate();
      });
  }

  function renderColumnList() {
    var list = document.getElementById('export-col-list');
    if (!tableColumns.length) {
      list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">No columns found.</div>';
      gate();
      return;
    }
    var html = '';
    tableColumns.forEach(function(col, idx) {
      var checked = col.type !== 'embedding' ? ' checked' : '';
      html += '<div class="export-col-item">' +
        '<input type="checkbox" id="export-col-' + idx + '" data-col="' + _esc(col.name) + '"' + checked + ' onchange="_expUpdateCount()">' +
        '<label for="export-col-' + idx + '" style="flex:1;cursor:pointer">' + _esc(col.name) + '</label>' +
        '<span class="export-col-type type-' + _esc(col.type) + '">' + _esc(col.type) + '</span>' +
        '</div>';
    });
    list.innerHTML = html;
    _expUpdateCount();
  }

  window._expSelectAll = function(checked) {
    var cbs = document.getElementById('export-col-list').querySelectorAll('input[type="checkbox"]');
    cbs.forEach(function(cb) { cb.checked = checked; });
    _expUpdateCount();
  };

  window._expUpdateCount = function() {
    var cbs = document.getElementById('export-col-list').querySelectorAll('input[type="checkbox"]');
    var n = 0; cbs.forEach(function(cb) { if (cb.checked) n++; });
    var el = document.getElementById('export-col-count');
    if (el) el.textContent = n + ' / ' + cbs.length + ' columns selected';
    gate();
  };

  function getSelectedColumns() {
    var cbs = document.getElementById('export-col-list').querySelectorAll('input[type="checkbox"]:checked');
    var cols = [];
    cbs.forEach(function(cb) { cols.push(cb.getAttribute('data-col')); });
    return cols;
  }

  // ── What Export, Select all and Deselect all wait for (PBI 19074) ──
  function currentTableUrl() { return document.getElementById('export-table-url').value.trim(); }

  function currentOutputPath() {
    var el = document.getElementById('export-output-path');
    return el ? el.value.trim() : '';
  }

  // ── The output, as the server reads it (PBI 19097) ──
  function selectedFormatDef() { return formats.find(function(f) { return f.name === selectedFormat; }) || null; }
  // YOLO writes a folder (its YAML, images and labels); every other format writes one file.
  function outputIsFolder() { return selectedFormat === 'yolo'; }
  function formatExtension() { var f = selectedFormatDef(); return (f && f.file_extension) || ''; }
  function hasExtension(v) { return /\.[A-Za-z0-9]{1,6}$/.test(v.replace(/\/$/, '')); }
  function safeName(s) { return String(s || '').replace(/[^A-Za-z0-9._-]+/g, '_'); }
  // The file each format writes into a folder, as the executors in __init__.py name it.
  var DEFAULT_FILE = { csv: 'export.csv', xlsx: 'export.xlsx', coco: 'annotations.json' };

  // What the chooser's name box starts with: the table's own name (project, dataset, table, from /columns)
  // plus the format's extension; for YOLO one folder per project, so train and val export into one dataset.
  function suggestedOutputName() {
    var stem = tableStem || 'export';
    if (outputIsFolder()) return (safeName(tableProject) || stem) + '-yolo';
    return stem + formatExtension();
  }

  // What the export writes, for the line under the field: a value ending in the format's extension is the
  // file; anything else is a folder the default file goes in (the executors read it the same way).
  function writesLine() {
    var v = currentOutputPath();
    var fmt = selectedFormatDef();
    if (!v || !fmt) return '';
    var later = v.indexOf('://') !== -1 ? ', written there when the export finishes' : '';
    var dir = v.replace(/\/$/, '');
    if (outputIsFolder()) {
      if (hasExtension(v)) return 'A YOLO export writes a folder, not a file.';
      return 'Writes ' + dir + '/dataset.yaml, with images/<split> and labels/<split>' + later + '.';
    }
    var ext = formatExtension();
    var isFile = ext && v.toLowerCase().slice(-ext.length) === ext;
    return 'Writes ' + (isFile ? v : dir + '/' + (DEFAULT_FILE[fmt.name] || 'export' + ext)) + later + '.';
  }

  function updateOutputNotes() {
    var help = document.getElementById('export-output-help');
    if (help) {
      help.textContent = !selectedFormat ? ''
        : outputIsFolder()
          ? 'A folder, on the machine the export runs on or in a bucket: the dataset\'s YAML, images and labels go in it.'
          : 'A file, or a folder to write ' + (DEFAULT_FILE[selectedFormat] || 'the export') + ' in, on the machine'
            + ' the export runs on or in a bucket.';
    }
    var writes = document.getElementById('export-writes');
    if (writes) writes.textContent = writesLine();
  }

  // A value named for the format before (x.csv) follows a switch to another file format (x.xlsx).
  function followFormat(before) {
    var v = currentOutputPath();
    var was = before && before.file_extension;
    var ext = formatExtension();
    if (was && before.name !== 'yolo' && !outputIsFolder() && ext && v.toLowerCase().slice(-was.length) === was) {
      _tlcSetDataSourceValue('export-output-path', v.slice(0, -was.length) + ext);
    }
    updateOutputNotes();
    // The chooser, if open, follows the format too: a file or a folder, the filter, the suggested name.
    if (outputChooser && outputChooser.refresh) outputChooser.refresh();
  }

  function needsColumns() {
    var fmt = formats.find(function(f) { return f.name === selectedFormat; });
    return !!(fmt && fmt.needs_column_select);
  }

  // Why the current table's columns are not listed yet, as what to do to enable `label`; '' once they are.
  function columnsBlocker(label) {
    var tableUrl = currentTableUrl();
    if (!tableUrl) return 'Choose a table to enable ' + label + '.';
    if (_colsUrl !== tableUrl || _colsState === 'loading') {
      return 'Wait while the table\'s columns are listed to enable ' + label + '.';
    }
    if (_colsState !== 'ok' || !tableColumns.length) {
      return 'Choose a table whose columns can be listed to enable ' + label + '.';
    }
    return '';
  }

  var _exporting = false;

  // Why Export cannot run yet, as what to do; '' when it can. An empty column list used to export every
  // column (the server reads no columns as all of them), so a CSV or Excel export needs one ticked.
  function exportBlocker() {
    if (_exporting) return 'Wait for the export to finish to enable Export.';
    if (!currentTableUrl()) return 'Choose a table to enable Export.';
    if (!selectedFormat) return 'Choose an export format to enable Export.';
    if (!currentOutputPath()) return 'Enter an output path to enable Export.';
    if (outputIsFolder() && hasExtension(currentOutputPath())) {
      return 'Choose a folder, not a file, to enable Export.';
    }
    if (needsColumns()) {
      var cols = columnsBlocker('Export');
      if (cols) return cols;
      if (!getSelectedColumns().length) return 'Tick at least one column to enable Export.';
    }
    return '';
  }

  // Export, and the column list's Select all and Deselect all, disabled while they cannot run or would
  // change nothing, each saying why in its tooltip; Export's reason also shows on the line under it.
  function gate() {
    updateOutputNotes();
    var btn = document.getElementById('export-submit-btn');
    var reason = exportBlocker();
    btn.disabled = _exporting || !!reason;
    btn.title = reason;
    document.getElementById('export-submit-why').textContent = reason;

    var cbs = document.getElementById('export-col-list').querySelectorAll('input[type="checkbox"]');
    var ticked = 0;
    cbs.forEach(function(cb) { if (cb.checked) ticked++; });
    var all = document.getElementById('export-select-all');
    var allWhy = columnsBlocker('Select all') ||
      (ticked === cbs.length ? 'Nothing to select: every column is already ticked.' : '');
    all.disabled = !!allWhy;
    all.title = allWhy;
    var none = document.getElementById('export-deselect-all');
    var noneWhy = columnsBlocker('Deselect all') || (ticked === 0 ? 'Nothing to deselect: no column is ticked.' : '');
    none.disabled = !!noneWhy;
    none.title = noneWhy;
  }

  function renderFormatOptions() {
    var container = document.getElementById('export-format-options');
    var fmt = formats.find(function(f) { return f.name === selectedFormat; });
    if (!fmt || !fmt.options || !fmt.options.length) { container.innerHTML = ''; return; }
    var html = '<div class="format-options-label">' + _esc(fmt.display_name) + ' Options</div>';
    fmt.options.forEach(function(opt) {
      html += '<div class="form-group">';
      html += '<label class="form-label" for="export-opt-' + opt.name + '">' + _esc(opt.label) + '</label>';
      if (opt.type === 'select') {
        html += '<select id="export-opt-' + opt.name + '" class="form-control" style="max-width:240px">';
        (opt.choices || []).forEach(function(c) {
          var display = c === 'tab' ? 'Tab' : c;
          html += '<option value="' + _esc(c) + '"' + (c === opt.default ? ' selected' : '') + '>' + _esc(display) + '</option>';
        });
        html += '</select>';
      } else {
        html += '<input type="text" id="export-opt-' + opt.name + '" class="form-control" style="max-width:240px"' +
                ' value="' + _esc(opt.default || '') + '" placeholder="' + _esc(opt.default || '') + '">';
      }
      if (opt.help) html += '<div class="form-help">' + _esc(opt.help) + '</div>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  // The export runs as a host-managed job (POST /run -> run_job), not a held
  // request: a YOLO export copying images runs for minutes, far past any fetch
  // timeout. Progress arrives on the generic job channel; the rich result dict
  // arrives as the plugin's own 'export_result' event, matched on job_id.
  var _resultUnsub = null;
  var _resultShown = false;

  function executeExport() {
    if (exportBlocker()) { gate(); return; }
    var tableUrl = currentTableUrl();
    var outputPath = currentOutputPath();
    var spinner = document.getElementById('export-spinner');
    var status = document.getElementById('export-status');

    // project_name doubles as the Queue & Progress panel's project filter on the
    // host. The exported TABLE's project wins: on a bare sidebar launch the
    // context project is '', and an unattributed job appears in no panel.
    var body = {
      format: selectedFormat, table_url: tableUrl, output_path: outputPath,
      project_name: tableProject || (API.context && API.context.projectName) || urlParams.get('project') || ''
    };
    var fmt = formats.find(function(f) { return f.name === selectedFormat; });
    if (fmt && fmt.options) {
      fmt.options.forEach(function(opt) {
        var el = document.getElementById('export-opt-' + opt.name);
        if (el) body[opt.name] = el.value;
      });
    }
    // Never empty here: the gate waits for a ticked column (none would export them all).
    if (fmt && fmt.needs_column_select) body.columns = getSelectedColumns();

    _exporting = true;
    gate();
    spinner.style.display = 'inline-block';
    status.style.display = 'inline';
    _resultShown = false;

    function cleanup() {
      _exporting = false;
      gate();
      spinner.style.display = 'none';
      status.style.display = 'none';
      status.textContent = '';
      if (_resultUnsub) { _resultUnsub(); _resultUnsub = null; }
    }

    // Subscribe to the rich result before starting, so a fast export can't
    // finish between the /run response and the subscription.
    var jobId = null;
    var pendingResult = null;
    if (_resultUnsub) _resultUnsub();
    _resultUnsub = PluginJobs.on('/exporter', 'export_result', function(payload) {
      if (jobId === null) { pendingResult = payload; return; }
      if (payload && payload.job_id === jobId) { _resultShown = true; showResult(payload); }
    });

    PluginJobs.run('exporter', body, {
      onUpdate: function(job) {
        var label = job && job.progress && job.progress.label;
        if (label) status.textContent = label;
      },
      onDone: function() {
        cleanup();
        if (!_resultShown) {
          showResult({ success: true, message: 'Export completed. Output at: ' + outputPath });
        }
      },
      onError: function(job) {
        cleanup();
        if (!_resultShown) {
          // Failure text rides `error`; older hosts put it on the progress label.
          var label = (job && (job.error || (job.progress && job.progress.label))) || 'Export failed — see the Queue page for details.';
          showResult({ success: false, message: label });
        }
      },
    }).then(function(resp) {
      jobId = resp && resp.job_id;
      if (pendingResult && pendingResult.job_id === jobId) {
        _resultShown = true;
        showResult(pendingResult);
      }
      pendingResult = null;
    }).catch(function(err) {
      cleanup();
      showResult({ success: false, message: 'Failed to start export: ' + err.message });
    });
  }

  function showResult(data) {
    var el = document.getElementById('export-result');
    if (API.showResult) { API.showResult(el, data); return; }
    // Frontends without the shared result box: the message alone.
    el.innerHTML = '<div class="alert ' + (data.success ? 'alert-success' : 'alert-error') + '"><div><strong>' +
      _esc(data.message) + '</strong></div></div>';
  }

  var _colDebounce = null;
  document.getElementById('export-table-url').addEventListener('input', function() {
    clearTimeout(_colDebounce);
    _colDebounce = setTimeout(function() {
      // Always resolve — for yolo/coco this only refreshes the table's project
      // for job attribution; the column list renders only where it exists.
      tableColumns = [];
      loadColumns(document.getElementById('export-table-url').value.trim());
    }, 500);
  });

  document.getElementById('export-submit-btn').addEventListener('click', executeExport);
  // Typing, a Browse pick (the table field and the output widget fire both) and the column ticks.
  document.getElementById('export-form').addEventListener('input', gate);
  document.getElementById('export-form').addEventListener('change', gate);

  function _esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // The output path's chooser follows the format: a folder for YOLO, else a file with the format's extension,
  // and its name box starts with a name made from the table (suggestedOutputName).
  var dsContainer = document.getElementById('export-output-ds');
  dsContainer.innerHTML = _tlcDataSourceHtml('export-output-path', {
    placeholder: 'Folder or file to write to, or a bucket URL',
  });
  outputChooser = _tlcBindDataSource('export-output-path', computeUrl, 'exporter', {
    purpose: 'output',
    mode: function() { return outputIsFolder() ? 'folder' : 'file'; },
    accept: function() { var ext = formatExtension(); return !outputIsFolder() && ext ? '*' + ext : ''; },
    suggestedName: suggestedOutputName,
  });

  document.getElementById('export-output-path').required = true;

  if (prefillUrl) document.getElementById('export-table-url').value = prefillUrl;
  gate();
  loadFormats();
