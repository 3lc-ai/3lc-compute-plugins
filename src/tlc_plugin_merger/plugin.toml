# 3LC Compute plugin manifest — the single source of truth for this plugin's
# metadata. The host loads the plugin via runtime.entrypoint; there is no
# register() call at import and no metadata on the plugin class.
id = "merger"
name = "Merge"
description = "Combine two tables into one by merging rows or columns."
version = "1.0.0"
min_service_version = "0.1.0"
icon = "⇌"
icon_svg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h3v8H4zM9 4h3v8H9z"/><path d="M7 8h2"/></svg>'

[ui]
display_mode = "sidebar"
section = "Data Ops"
compatible_with = ["table"]
input_types = ["table", "table"]
output_types = ["table"]
priority = 65
group = "Table Ops"
quick_action = true
quick_action_label = "Merge Tables"
quick_action_description = "Combine columns from two tables into one"

[runtime]
isolation = "venv"
entrypoint = "tlc_plugin_merger:MergePlugin"
# No deps beyond the SDK floor; the (empty) extra still gives this plugin its own
# provisioned venv so it runs out-of-process like every other open plugin.
provision_extra = "merger"
